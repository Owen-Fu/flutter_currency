name: flutter test

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
    
jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        flutter-version: [3.24.3]  # 指定 Flutter 版本，可以根據需求調整

    steps:
      # 檢出程式碼
      - name: Checkout repository
        uses: actions/checkout@v3

      # 設置 Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}

      # 顯示 Flutter 版本
      - name: Flutter version
        run: flutter --version

      # 安裝相依套件
      - name: Install dependencies
        run: flutter pub get

      # 運行測試
      - name: Run tests
        run: flutter test

      # 可選：上傳測試覆蓋率報告
      # - name: Upload coverage to Coveralls
      #   uses: coverallsapp/github-action@v3
      #   with:
      #     github-token: ${{ secrets.GITHUB_TOKEN }}
